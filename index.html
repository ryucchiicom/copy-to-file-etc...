<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT ↔ Clipboard</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    button {
      padding: 10px 14px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 14px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <input
    type="file"
    id="fileInput"
    accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
  >

  <button id="fileToClipboard">TXT… → clipboard</button>
  <button id="clipboardToFile">clipboard → TXT</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const fileToClipboard = document.getElementById("fileToClipboard");
    const clipboardToFile = document.getElementById("clipboardToFile");

    fileToClipboard.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const text = reader.result;

        try {
          await navigator.clipboard.writeText(text);

          fileToClipboard.textContent = "コピーしました！";

          setTimeout(() => {
            fileToClipboard.textContent = "TXT… → clipboard";
          }, 1500);

        } catch (error) {
          const textarea = document.createElement("textarea");

          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          try {
            document.execCommand("copy");
          } catch (e) {
          }

          textarea.remove();

          fileToClipboard.textContent = "コピーしました！";

          setTimeout(() => {
            fileToClipboard.textContent = "TXT… → clipboard";
          }, 1500);
        }
      };

      reader.readAsText(file);

      fileInput.value = "";
    });

    clipboardToFile.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        if (!text) {
          clipboardToFile.textContent = "空です";

          setTimeout(() => {
            clipboardToFile.textContent = "clipboard → TXT";
          }, 1500);

          return;
        }

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "clipboard.txt";
        a.click();

        URL.revokeObjectURL(url);

        clipboardToFile.textContent = "保存しました！";

        setTimeout(() => {
          clipboardToFile.textContent = "clipboard → TXT";
        }, 1500);

      } catch (error) {
        clipboardToFile.textContent = "取得できませんでした";

        setTimeout(() => {
          clipboardToFile.textContent = "clipboard → TXT";
        }, 1500);
      }
    });
  </script>

</body>
</html>
