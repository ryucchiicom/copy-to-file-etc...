<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト変換</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    #container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 18px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div id="container">
    <input
      type="file"
      id="fileInput"
      accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
    >

    <button id="uploadButton">再アップロード</button>

    <button id="saveButton">クリップボード → TXT</button>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const saveButton = document.getElementById("saveButton");

    window.addEventListener("load", () => {
      fileInput.click();
    });

    uploadButton.addEventListener("click", () => {
      fileInput.value = "";
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const text = reader.result;

        try {
          await navigator.clipboard.writeText(text);

          uploadButton.textContent = "コピーしました！";

          setTimeout(() => {
            uploadButton.textContent = "再アップロード";
          }, 1500);
        } catch (error) {
          const textarea = document.createElement("textarea");

          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          try {
            document.execCommand("copy");
          } catch (e) {
          }

          textarea.remove();

          uploadButton.textContent = "コピーしました！";

          setTimeout(() => {
            uploadButton.textContent = "再アップロード";
          }, 1500);
        }
      };

      reader.readAsText(file);
    });

    saveButton.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        if (!text) {
          saveButton.textContent = "クリップボードが空です";

          setTimeout(() => {
            saveButton.textContent = "クリップボード → TXT";
          }, 1500);

          return;
        }

        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: "clipboard.txt",
            types: [
              {
                description: "テキストファイル",
                accept: {
                  "text/plain": [".txt"]
                }
              }
            ]
          });

          const writable = await handle.createWritable();

          await writable.write(text);
          await writable.close();

          saveButton.textContent = "保存しました！";

          setTimeout(() => {
            saveButton.textContent = "クリップボード → TXT";
          }, 1500);

          return;
        }

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "clipboard.txt";
        a.click();

        URL.revokeObjectURL(url);

        saveButton.textContent = "保存しました！";

        setTimeout(() => {
          saveButton.textContent = "クリップボード → TXT";
        }, 1500);

      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }

        saveButton.textContent = "取得できませんでした";

        setTimeout(() => {
          saveButton.textContent = "クリップボード → TXT";
        }, 1500);
      }
    });
  </script>

</body>
</html>
