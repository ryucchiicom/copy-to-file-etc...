<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT/HTML コピー</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    #buttons {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    button {
      padding: 10px 18px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div id="buttons">
    <input
      type="file"
      id="fileInput"
      accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
    >

    <button id="uploadButton">再アップロード</button>
    <button id="clipboardButton">クリップボード → TXT</button>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const clipboardButton = document.getElementById("clipboardButton");

    window.addEventListener("load", () => {
      fileInput.click();
    });

    uploadButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const text = reader.result;

        try {
          await navigator.clipboard.writeText(text);
          uploadButton.textContent = "コピーしました！";

          setTimeout(() => {
            uploadButton.textContent = "再アップロード";
          }, 1500);
        } catch (error) {
          const textarea = document.createElement("textarea");

          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          try {
            document.execCommand("copy");
          } catch (e) {
          }

          textarea.remove();

          uploadButton.textContent = "コピーしました！";

          setTimeout(() => {
            uploadButton.textContent = "再アップロード";
          }, 1500);
        }
      };

      reader.readAsText(file);
    });

    clipboardButton.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "clipboard.txt";
        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        clipboardButton.textContent = "TXTを作成しました！";

        setTimeout(() => {
          clipboardButton.textContent = "クリップボード → TXT";
        }, 1500);

      } catch (error) {
        clipboardButton.textContent = "取得できませんでした";

        setTimeout(() => {
          clipboardButton.textContent = "クリップボード → TXT";
        }, 1500);
      }
    });
  </script>

</body>
</html>
