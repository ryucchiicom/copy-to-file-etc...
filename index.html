<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT ↔ Clipboard</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    button {
      width: 180px;
      padding: 10px 18px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }

    #filenameArea {
      display: none;
      align-items: center;
      gap: 0;
      height: 38px;
    }

    #filename,
    #extension {
      box-sizing: border-box;
      height: 38px;
      border: 1px solid GrayText;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      outline: none;
    }

    #filename {
      width: 120px;
      padding: 0 8px;
      border-radius: 10px 0 0 10px;
      border-right: none;
    }

    #extension {
      width: 55px;
      padding: 0 8px;
      border-radius: 0 10px 10px 0;
      border-left: none;
    }

    #dot {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid GrayText;
      border-bottom: 1px solid GrayText;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="buttons">
    <button id="uploadButton">TXT… → clipboard</button>

    <button id="fileButton">clipboard → TXT</button>

    <div id="filenameArea">
      <input
        type="text"
        id="filename"
        autocomplete="off"
        spellcheck="false"
      >
      <span id="dot">.</span>
      <input
        type="text"
        id="extension"
        value="txt"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
  </div>

  <input
    type="file"
    id="fileInput"
    accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
  >

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const fileButton = document.getElementById("fileButton");
    const filenameArea = document.getElementById("filenameArea");
    const filename = document.getElementById("filename");
    const extension = document.getElementById("extension");

    let clipboardText = "";

    window.addEventListener("load", () => {
      fileInput.click();
    });

    uploadButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const text = reader.result;

        try {
          await navigator.clipboard.writeText(text);
          uploadButton.textContent = "copied!";

          setTimeout(() => {
            uploadButton.textContent = "TXT… → clipboard";
          }, 1500);
        } catch (error) {
          const textarea = document.createElement("textarea");

          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          try {
            document.execCommand("copy");
            uploadButton.textContent = "copied!";
          } catch (e) {
            uploadButton.textContent = "copy failed";
          }

          textarea.remove();

          setTimeout(() => {
            uploadButton.textContent = "TXT… → clipboard";
          }, 1500);
        }
      };

      reader.readAsText(file);
      fileInput.value = "";
    });

    fileButton.addEventListener("click", async () => {
      try {
        clipboardText = await navigator.clipboard.readText();

        filename.value = "";
        extension.value = "txt";

        fileButton.style.display = "none";
        filenameArea.style.display = "flex";

        filename.focus();
      } catch (error) {
        fileButton.textContent = "failed";

        setTimeout(() => {
          fileButton.textContent = "clipboard → TXT";
        }, 1500);
      }
    });

    filename.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        extension.focus();
        extension.select();
      }
    });

    extension.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();

        const name = filename.value.trim();
        const ext = extension.value.trim();

        if (!name || !ext) {
          return;
        }

        const blob = new Blob([clipboardText], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = name + "." + ext;

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        filenameArea.style.display = "none";
        fileButton.style.display = "block";
        fileButton.textContent = "filed!";

        setTimeout(() => {
          fileButton.textContent = "clipboard → TXT";
        }, 1500);
      }
    });
  </script>

</body>
</html>
