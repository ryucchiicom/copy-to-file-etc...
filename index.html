<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT ↔ Clipboard</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    button {
      padding: 10px 18px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <input
    type="file"
    id="fileInput"
    accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
  >

  <button id="uploadButton">TXT… → clipboard</button>
  <button id="fileButton">clipboard → TXT</button>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const fileButton = document.getElementById("fileButton");

    function resetUploadButton() {
      setTimeout(() => {
        uploadButton.textContent = "TXT… → clipboard";
      }, 1500);
    }

    function resetFileButton() {
      setTimeout(() => {
        fileButton.textContent = "clipboard → TXT";
      }, 1500);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (error) {
        const textarea = document.createElement("textarea");

        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        let success = false;

        try {
          success = document.execCommand("copy");
        } catch (e) {
          success = false;
        }

        textarea.remove();

        return success;
      }
    }

    async function uploadFile() {
      fileInput.value = "";
      fileInput.click();
    }

    uploadButton.addEventListener("click", uploadFile);

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const success = await copyText(reader.result);

        if (success) {
          uploadButton.textContent = "copied!";
        } else {
          uploadButton.textContent = "copy failed";
        }

        resetUploadButton();
      };

      reader.readAsText(file);
    });

    fileButton.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "clipboard.txt";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        fileButton.textContent = "filed!";
      } catch (error) {
        fileButton.textContent = "failed!";
      }

      resetFileButton();
    });

    window.addEventListener("load", () => {
      fileInput.click();
    });
  </script>

</body>
</html>
