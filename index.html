<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT ↔ Clipboard</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 180px;
      padding: 10px 18px;
      border: 1px solid GrayText;
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.6;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

  <div class="buttons">
    <button id="uploadButton">TXT… → clipboard</button>
    <button id="fileButton">clipboard → TXT</button>
  </div>

  <input
    type="file"
    id="fileInput"
    accept=".txt,.html,.htm,.css,.js,.json,.xml,.csv,.md,.log,text/plain,text/html"
  >

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const fileButton = document.getElementById("fileButton");

    window.addEventListener("load", () => {
      fileInput.click();
    });

    uploadButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = async () => {
        const text = reader.result;

        try {
          await navigator.clipboard.writeText(text);
          uploadButton.textContent = "copied!";

          setTimeout(() => {
            uploadButton.textContent = "TXT… → clipboard";
          }, 1500);
        } catch (error) {
          const textarea = document.createElement("textarea");

          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          try {
            document.execCommand("copy");
            uploadButton.textContent = "copied!";
          } catch (e) {
            uploadButton.textContent = "copy failed";
          }

          textarea.remove();

          setTimeout(() => {
            uploadButton.textContent = "TXT… → clipboard";
          }, 1500);
        }
      };

      reader.readAsText(file);

      fileInput.value = "";
    });

    fileButton.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "clipboard.txt";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        fileButton.textContent = "filed!";

        setTimeout(() => {
          fileButton.textContent = "clipboard → TXT";
        }, 1500);
      } catch (error) {
        fileButton.textContent = "failed";

        setTimeout(() => {
          fileButton.textContent = "clipboard → TXT";
        }, 1500);
      }
    });
  </script>

</body>
</html>
